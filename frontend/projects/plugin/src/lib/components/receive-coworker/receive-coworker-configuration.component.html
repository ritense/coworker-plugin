<v-form
  (valueChange)="formValueChange($event)"
  *ngIf="{
    disabled: disabled$ | async,
    prefill: prefillConfiguration$ ? (prefillConfiguration$ | async) : null
  } as obs"
>
  <p class="receive-coworker__description">
    {{ 'receiveDescription' | pluginTranslate: pluginId | async }}
  </p>
  <v-select
    name="eventType"
    [items]="eventTypeItems"
    [title]="'eventType' | pluginTranslate: pluginId | async"
    [margin]="true"
    [defaultSelectionId]="obs.prefill?.eventType"
    [disabled]="obs.disabled"
    [tooltip]="'receiveEventTypeTooltip' | pluginTranslate: pluginId | async"
  ></v-select>
  <valtimo-carbon-multi-input
    name="resultMappings"
    type="keyValue"
    [title]="'resultMappings' | pluginTranslate: pluginId | async"
    [tooltip]="'resultMappingsTooltip' | pluginTranslate: pluginId | async"
    [keyColumnTitle]="'resultMappingSource' | pluginTranslate: pluginId | async"
    [valueColumnTitle]="'resultMappingTarget' | pluginTranslate: pluginId | async"
    [addRowText]="'resultMappingAddRow' | pluginTranslate: pluginId | async"
    [defaultValues]="(prefillMappings$ | async) ?? []"
    [disabled]="!!obs.disabled"
    [margin]="true"
    [fullWidth]="true"
  ></valtimo-carbon-multi-input>
</v-form>
