<v-form
  (valueChange)="formValueChange($event)"
  *ngIf="{
    disabled: disabled$ | async,
    prefill: prefillConfiguration$ ? (prefillConfiguration$ | async) : null
  } as obs"
>
  <v-paragraph>{{ 'chatDescription' | pluginTranslate: pluginId | async }}</v-paragraph>
  <v-select
    name="coworkerId"
    [items]="(coworkerItems$ | async) ?? []"
    [title]="'publishCoworkerId' | pluginTranslate: pluginId | async"
    [margin]="true"
    [defaultSelectionId]="obs.prefill?.coworkerId"
    [disabled]="obs.disabled"
    [required]="true"
    [loading]="(loadingCoworkers$ | async) ?? false"
    [tooltip]="'publishCoworkerIdTooltip' | pluginTranslate: pluginId | async"
  ></v-select>
  <v-input
    name="userPrompt"
    [title]="'userPrompt' | pluginTranslate: pluginId | async"
    [margin]="true"
    [defaultValue]="obs.prefill?.userPrompt"
    [disabled]="obs.disabled"
    [tooltip]="'userPromptTooltip' | pluginTranslate: pluginId | async"
  ></v-input>
  <v-input
    name="expertiseId"
    [title]="'expertiseId' | pluginTranslate: pluginId | async"
    [margin]="true"
    [defaultValue]="obs.prefill?.expertiseId"
    [disabled]="obs.disabled"
    [tooltip]="'expertiseIdTooltip' | pluginTranslate: pluginId | async"
  ></v-input>
  <v-input
    name="input"
    [title]="'input' | pluginTranslate: pluginId | async"
    [margin]="true"
    [defaultValue]="obs.prefill?.input"
    [disabled]="obs.disabled"
    [tooltip]="'inputTooltip' | pluginTranslate: pluginId | async"
    placeholder='{"key": "value"}'
  ></v-input>
</v-form>
